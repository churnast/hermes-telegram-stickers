name: Bug report
description: Something does not work the way the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please remove tokens, chat ids and personal data before posting.
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version
      description: Output of `hermes --version`.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: Output of `hermes plugins show telegram-stickers`, or the version in plugin.yaml.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or tool output
      render: text
