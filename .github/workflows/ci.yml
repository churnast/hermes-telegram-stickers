name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.6,<1"
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<9"
      - run: python -m pytest -c tests/pytest.ini --rootdir tests tests

  hermes:
    name: hermes validate (Hermes Agent 0.21.5)
    runs-on: ubuntu-latest
    env:
      HERMES_REF: v2026.9.24
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes Agent
        run: |
          git clone --depth 1 --branch "$HERMES_REF" https://github.com/NousResearch/hermes-agent.git hermes
          uv venv --python 3.14 .venv
          uv pip install --python .venv -e ./hermes
      - name: Validate like the plugin catalog
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: ../.venv/bin/hermes plugins validate .
      - name: Check runtime contracts
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: ../.venv/bin/hermes plugins doctor . --ci
