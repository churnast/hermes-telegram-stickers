name: telegram-stickers
version: 0.1.0
manifest_version: 2
description: "Lets the agent answer with stickers from its owner's own Telegram sticker packs: picks by meaning or emoji, replies in the current chat and forum topic, avoids repeats, with a per-chat cooldown and an off switch."
author: "churnast"
license: MIT
homepage: "https://github.com/churnast/hermes-telegram-stickers"
tags: [telegram, stickers, gateway, vision]
requires_hermes: ">=0.21.5"
provides_tools:
  - telegram_sticker_find
  - telegram_sticker_send
  - telegram_sticker_mute
provides_hooks: []
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: "The bot token your Hermes Telegram gateway already uses. Stickers are sent as that bot."
    url: "https://core.telegram.org/bots#how-do-i-create-a-bot"
    secret: true
config_schema:
  packs:
    type: list
    default: []
    label: "Sticker packs"
    description: "Sticker set short names (the part after t.me/addstickers/) or full links, favourite first."
  cooldown_seconds:
    type: int
    default: 20
    label: "Cooldown per chat (seconds)"
    description: "Minimum gap between two stickers in the same chat. 0 turns it off."
  min_messages_between:
    type: int
    default: 8
    label: "Messages between stickers"
    description: "At least this many messages (counted by Telegram message numbers) between two stickers in a chat. 0 turns pacing off."
  describe_batch:
    type: int
    default: 30
    label: "Stickers per /stickers describe"
    description: "How many stickers one '/stickers describe' run sends to the vision model (one image each)."
  allow_other_chats:
    type: bool
    default: false
    label: "Allow other chats"
    description: "Off: stickers go only to the chat of the current turn. On: the agent may pass any chat_id."
  api_base:
    type: str
    default: "https://api.telegram.org"
    label: "Bot API base URL"
    description: "Change only if your gateway uses a self-hosted Bot API server."
